    <circle cx="500" cy="240" r="94" fill="#FFB63D"/>
    <polygon points="378,360 622,360 592,596 408,596" fill="#FFB63D" stroke="#FFB63D" stroke-width="52" stroke-linejoin="round"/>
    <polyline points="442,588 434,842" fill="none" stroke="#FFB63D" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="566,588 706,784" fill="none" stroke="#FFB63D" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
</g></svg>